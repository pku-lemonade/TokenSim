[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensim"
version = "0.1.0"
description = "A deterministic event simulator for LLM serving workloads"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.25",
    "simpy>=4.1,<5",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0",
    "pyarrow>=14.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# orjson speeds up parsing multi-gigabyte AgentX traces; json is the fallback.
agentx = ["huggingface_hub>=0.34", "orjson>=3.10"]
dev = ["pytest>=8", "black==24.2.0"]
trace = ["msgpack>=1.1,<2"]

[project.scripts]
tokensim = "TokenSim.cli:cli"
tokensim-operator-data = "TokenSim.operator_data.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "third_party/licenses/*"]

[tool.setuptools.packages.find]
include = ["TokenSim*"]
namespaces = true

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

