schema_version: 1
device_id: l4
family: nvidia_gpu
display_name: NVIDIA L4
aliases: [L4, NVIDIA L4]
sources:
  nvidia-l4-datasheet:
    grade: A
    reference: https://www.nvidia.com/en-us/data-center/l4/
    notes: FP16 121 TFLOPS dense (242 sparse), FP8 242 TFLOPS, INT8 242 TOPS, TF32 60, FP32 30.3, 24 GB GDDR6 300 GB/s, PCIe Gen4 x16, 72 W.
  aiconfigurator-system-yaml:
    grade: C
    reference: https://github.com/ai-dynamo/aiconfigurator/blob/f254959eb89e2f206b8f9a77051644d7c1cbdb89/aic-core/src/aiconfigurator_core/systems/l4.yaml
    notes: >
      Empirical corrections NVIDIA recorded while validating AIConfigurator against TensorRT-LLM deployments: memory bandwidth efficiency 0.8, 3 us constant memory latency per kernel, 10 us point-to-point latency for collectives, and a runtime memory reserve of 392 MB NCCL buffers plus 3.5 GB framework workspace. Upstream database has no measured tables for this system (empty data directory).
peak_compute:
  fp16: {value: 121.0e12, source_id: nvidia-l4-datasheet}
  bf16: {value: 121.0e12, source_id: nvidia-l4-datasheet}
  fp8: {value: 242.0e12, source_id: nvidia-l4-datasheet}
  int8: {value: 242.0e12, source_id: nvidia-l4-datasheet}
  tf32: {value: 60.0e12, source_id: nvidia-l4-datasheet}
  fp32: {value: 30.3e12, source_id: nvidia-l4-datasheet}
memory:
  kind: gddr6
  capacity_bytes: {value: 25769803776, source_id: nvidia-l4-datasheet}
  bandwidth_bytes_per_s: {value: 300.0e9, source_id: nvidia-l4-datasheet}
  reserved_bytes: {value: 4169138176, source_id: aiconfigurator-system-yaml, grade: C}   # 392 MB NCCL + 3.5 GB runtime reserve
interconnect:
  scale_up_link: null
  host_link: pcie4_x16
analytical:
  source_id: aiconfigurator-system-yaml
  grade: C
  memory_efficiency: 0.8        # mem_bw_empirical_scaling_factor
  kernel_launch_us: 3.0         # mem_empirical_constant_latency
  collective_launch_us: 10.0    # p2p_latency
step_overhead_us: {value: 0.0, source_id: aiconfigurator-system-yaml, grade: D}
power: {tdp_w: 72}
