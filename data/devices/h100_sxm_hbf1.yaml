schema_version: 1
device_id: h100_sxm_hbf1
family: nvidia_gpu
display_name: H100 compute with HBF1 experimental 32 GiB GDDR7 memory
aliases: []
sources:
  aiconfigurator-system-yaml:
    grade: C
    reference: https://github.com/ai-dynamo/aiconfigurator/blob/f254959eb89e2f206b8f9a77051644d7c1cbdb89/aic-core/src/aiconfigurator_core/systems/h100_sxm.yaml
    notes: 'Empirical corrections NVIDIA recorded while validating AIConfigurator
      against TensorRT-LLM deployments: memory bandwidth efficiency 0.8, 3 us constant
      memory latency per kernel, 10 us point-to-point latency for collectives, and
      a runtime memory reserve of 392 MB NCCL buffers plus 3.5 GB framework workspace.

      '
  nvidia-h100-datasheet:
    grade: A
    reference: https://resources.nvidia.com/en-us-tensor-core/nvidia-tensor-core-gpu-datasheet
    notes: H100 SXM column. Datasheet lists sparsity figures (1,979 TFLOPS FP16);
      dense is half.
  assumption-gpu-analytical-v1:
    grade: D
    reference: docs/operator-latency-model.md#analytical-defaults
  hbf-memory-assumption:
    grade: D
    reference: https://arxiv.org/abs/2608.11668
    notes: Experimental GPU-memory parameters carried from the HBF snapshot (0b8d751);
      these are simulation assumptions.
