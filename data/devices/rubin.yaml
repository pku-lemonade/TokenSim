schema_version: 1
device_id: rubin
family: nvidia_gpu
display_name: NVIDIA Rubin GPU
aliases: [Rubin, Vera-Rubin-GPU]
sources:
  nvidia-rubin-product-oct2026:
    grade: A
    reference: https://www.nvidia.com/en-us/data-center/vera-rubin-nvl72/
    notes: Dense FP8 17.5 PFLOPS; dense BF16 4 PFLOPS; FP32 130 TFLOPS; 288 GB HBM4 at 19.2 TB/s; NVLink 3 TB/s bidirectional. Product-page snapshot retrieved 2026-10-14; the July architecture blog quotes higher bandwidth maxima.
