schema_version: 1
device_id: h100_pcie
family: nvidia_gpu
display_name: NVIDIA H100 PCIe 80GB
aliases: [H100-PCIe, H100-PCIE-80GB, NVIDIA H100 PCIe]
sources:
  nvidia-h100-datasheet:
    grade: A
    reference: https://resources.nvidia.com/en-us-tensor-core/nvidia-tensor-core-gpu-datasheet
    notes: H100 PCIe column - FP16 1,513 TFLOPS with sparsity (756 dense), FP8 3,026 (1,513 dense), 80 GB HBM2e 2 TB/s, 350 W, PCIe Gen5; NVLink bridge joins GPU pairs only.
  aiconfigurator-system-yaml:
    grade: C
    reference: https://github.com/ai-dynamo/aiconfigurator/blob/f254959eb89e2f206b8f9a77051644d7c1cbdb89/aic-core/src/aiconfigurator_core/systems/h100_pcie.yaml
    notes: >
      Empirical corrections NVIDIA recorded while validating AIConfigurator against TensorRT-LLM deployments: memory bandwidth efficiency 0.8, 3 us constant memory latency per kernel, 10 us point-to-point latency for collectives, and a runtime memory reserve of 392 MB NCCL buffers plus 3.5 GB framework workspace. Upstream database has no measured tables for this system (empty data directory).
peak_compute:
  fp16: {value: 756.5e12, source_id: nvidia-h100-datasheet}
  bf16: {value: 756.5e12, source_id: nvidia-h100-datasheet}
  fp8: {value: 1513.0e12, source_id: nvidia-h100-datasheet}
  int8: {value: 1513.0e12, source_id: nvidia-h100-datasheet}
  tf32: {value: 378.0e12, source_id: nvidia-h100-datasheet}
  fp32: {value: 51.0e12, source_id: nvidia-h100-datasheet}
memory:
  kind: hbm2e
  capacity_bytes: {value: 85899345920, source_id: nvidia-h100-datasheet}
  bandwidth_bytes_per_s: {value: 2000.0e9, source_id: nvidia-h100-datasheet}
  reserved_bytes: {value: 4169138176, source_id: aiconfigurator-system-yaml, grade: C}   # 392 MB NCCL + 3.5 GB runtime reserve
on_chip_memory:
  capacity_bytes: {value: 52428800, source_id: nvidia-h100-datasheet}
interconnect:
  scale_up_link: null
  host_link: pcie5_x16
analytical:
  source_id: aiconfigurator-system-yaml
  grade: C
  memory_efficiency: 0.8        # mem_bw_empirical_scaling_factor
  kernel_launch_us: 3.0         # mem_empirical_constant_latency
  collective_launch_us: 10.0    # p2p_latency
step_overhead_us: {value: 0.0, source_id: aiconfigurator-system-yaml, grade: D}
power: {tdp_w: 350}
