schema_version: 1
device_id: h200_sxm
family: nvidia_gpu
display_name: NVIDIA H200 141GB HBM3e
aliases: [H200, H200-SXM, NVIDIA H200]
sources:
  aiconfigurator-system-yaml:
    grade: C
    reference: https://github.com/ai-dynamo/aiconfigurator/blob/f254959eb89e2f206b8f9a77051644d7c1cbdb89/aic-core/src/aiconfigurator_core/systems/h200_sxm.yaml
    notes: >
      Empirical corrections NVIDIA recorded while validating AIConfigurator against
      TensorRT-LLM deployments: memory bandwidth efficiency 0.8, 3 us constant memory
      latency per kernel, 10 us point-to-point latency for collectives, and a runtime
      memory reserve of 392 MB NCCL buffers plus 3.5 GB framework workspace.
  nvidia-h200-product-page:
    grade: A
    reference: https://www.nvidia.com/en-us/data-center/h200/
    notes: Same GH100 compute as H100 SXM; 141 GB HBM3e at 4.8 TB/s.
  assumption-gpu-analytical-v1:
    grade: D
    reference: docs/operator-latency-model.md#analytical-defaults
peak_compute:
  fp16: {value: 989.4e12, source_id: nvidia-h200-product-page}
  bf16: {value: 989.4e12, source_id: nvidia-h200-product-page}
  fp8: {value: 1978.9e12, source_id: nvidia-h200-product-page}
  int8: {value: 1978.9e12, source_id: nvidia-h200-product-page}
  tf32: {value: 494.7e12, source_id: nvidia-h200-product-page}
  fp32: {value: 67.0e12, source_id: nvidia-h200-product-page}
memory:
  kind: hbm3e
  capacity_bytes: {value: 151397597184, source_id: nvidia-h200-product-page}      # 141 GiB
  bandwidth_bytes_per_s: {value: 4800.0e9, source_id: nvidia-h200-product-page}
  reserved_bytes: {value: 4169138176, source_id: aiconfigurator-system-yaml, grade: C}   # 392 MB NCCL + 3.5 GB runtime reserve
on_chip_memory:
  capacity_bytes: {value: 52428800, source_id: nvidia-h200-product-page}
interconnect:
  scale_up_link: nvlink4
  scale_up_ports: 18
  host_link: pcie5_x16
analytical:
  source_id: aiconfigurator-system-yaml
  grade: C
  memory_efficiency: 0.8        # mem_bw_empirical_scaling_factor
  kernel_launch_us: 3.0         # mem_empirical_constant_latency
  collective_launch_us: 10.0    # p2p_latency
step_overhead_us: {value: 0.0, source_id: assumption-gpu-analytical-v1, grade: D}
power: {tdp_w: 700}
