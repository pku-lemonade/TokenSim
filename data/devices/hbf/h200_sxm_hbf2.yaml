sources:
  aiconfigurator-system-yaml:
    grade: C
    reference: https://github.com/ai-dynamo/aiconfigurator/blob/f254959eb89e2f206b8f9a77051644d7c1cbdb89/aic-core/src/aiconfigurator_core/systems/h200_sxm.yaml
    notes: 'Empirical corrections NVIDIA recorded while validating AIConfigurator
      against TensorRT-LLM deployments: memory bandwidth efficiency 0.8, 3 us constant
