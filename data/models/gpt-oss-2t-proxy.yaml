schema_version: 1
model_id: gpt-oss-2t-proxy
display_name: GPT-OSS parameter-scaled 2T proxy
hidden_size: 2880
intermediate_size: 2880
num_layers: 36
num_attention_heads: 64
num_key_value_heads: 8
head_dim: 64
vocab_size: 201088
activation: swiglu
attention_type: gqa
max_position_embeddings: 1048576
dtype: fp8
activation_dtype: bf16
kv_cache_dtype: bf16
tie_word_embeddings: false
moe:
  num_experts: 2240
  num_experts_per_tok: 4
  moe_intermediate_size: 2880
  num_moe_layers: 36
sources:
  openai-gpt-oss-120b-config:
    grade: A
    reference: https://huggingface.co/openai/gpt-oss-120b/blob/main/config.json
    notes: Hidden, FFN, head, vocabulary and layer dimensions are transcribed from the 120B config.
  assumption-scaled-gpt-oss:
    grade: D
    reference: docs/lpx-reproduction.md
    notes: Expert count is increased to 2240 to approximate 2T parameters. Context limit is extended to 1M. The proxy uses full attention on all layers, FP8 weights and BF16 activations/KV; the public checkpoint has alternating 128-token windows and MXFP4 experts. NVIDIA did not publish its 2T architecture.
