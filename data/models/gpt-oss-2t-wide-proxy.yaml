    notes: >-
      Alternating 128-token local/full attention, top-4 of 128 experts, vocabulary and mixed expert/nonexpert precision follow the public checkpoint.
  assumption-scaled-gpt-oss:
    grade: D
    reference: docs/lpx-reproduction.md
    notes: >-
      Width 8192, 80 layers, 128-dimensional heads and 1M context are sensitivity assumptions.
