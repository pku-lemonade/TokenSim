schema_version: 1
model_id: gpt-oss-2t-expert-proxy
display_name: GPT-OSS expert-count-scaled 2T sensitivity proxy
hidden_size: 2880
intermediate_size: 2880
num_layers: 36
num_attention_heads: 64
num_key_value_heads: 8
head_dim: 64
vocab_size: 201088
activation: swiglu
attention_type: gqa
max_position_embeddings: 1048576
dtype: bf16
activation_dtype: bf16
kv_cache_dtype: bf16
tie_word_embeddings: false
moe:
  num_experts: 2240
  num_experts_per_tok: 4
  moe_intermediate_size: 2880
  num_moe_layers: 36
sources:
  openai-gpt-oss-120b-config:
    grade: A
    reference: https://huggingface.co/openai/gpt-oss-120b/blob/main/config.json
    notes: Hidden, FFN, head, vocabulary and layer dimensions are transcribed from
      the 120B config.
  assumption-scaled-gpt-oss:
    grade: D
    reference: docs/lpx-reproduction.md
    notes: 2240 experts and 1M context are sensitivity assumptions. Public GPT-OSS
      width, layer count, top-k, alternating attention and mixed precision are retained.
      NVIDIA did not publish its scaled architecture.
