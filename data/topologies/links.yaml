schema_version: 1
# Link classes referenced by device specs and topology levels.
# bandwidth_per_direction_bytes_per_s is the per-endpoint injection bandwidth in
# one direction. latency_us is the hardware hop latency; software launch cost of
# collectives is modelled separately (see comm/collectives.py).
# half_bandwidth_bytes is the message size at which streaming reaches half of
# peak and collective_efficiency the fraction of peak a large collective
# attains (nccl-tests busbw / peak). Both are grade-D defaults eyeballed from
# the AIConfigurator nccl tables; re-fit them with `operator_data.cli calibrate`.
links:
  nvlink2:
    display_name: NVLink 2 via NVSwitch (V100 DGX-2) or hybrid cube mesh, aggregate per GPU
    bandwidth_per_direction_bytes_per_s: 150.0e9
    latency_us: 1.5
    duplex: full
    half_bandwidth_bytes: 4194304
    collective_efficiency: 0.45
    source_id: nvidia-v100-datasheet
    notes: 300 GB/s bidirectional total across 6 links.
  pcie3_x16:
    display_name: PCIe 3.0 x16
    bandwidth_per_direction_bytes_per_s: 16.0e9
